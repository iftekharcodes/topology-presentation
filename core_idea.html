<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide-container { width: 1280px; min-height: 720px; background: #F8FAFC; color: #0F172A; display: flex; flex-direction: column; font-family: system-ui, -apple-system, sans-serif; position: relative; }
    .footer { position: absolute; bottom: 30px; left: 60px; right: 60px; display: flex; justify-content: space-between; font-size: 14px; color: #64748B; border-top: 1px solid #E2E8F0; padding-top: 10px; }
    .content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 60px 80px; text-align: center; }
    .invariant-box { background: white; padding: 60px; border-radius: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: 1px solid #E2E8F0; max-width: 900px; }
    .label { color: #0EA5E9; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 20px; }
    h2 { font-size: 42px; line-height: 1.3; color: #1E293B; margin-bottom: 40px; font-weight: 500; }
    .formula { display: flex; align-items: center; justify-content: center; gap: 20px; font-size: 32px; font-family: monospace; color: #334155; }
    .arrow { font-size: 48px; color: #0EA5E9; }
    .result { margin-top: 40px; padding: 20px 40px; background: #F1F5F9; border-radius: 12px; font-size: 24px; font-weight: 600; color: #0EA5E9; }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="content">
      <div class="invariant-box">
        <div class="label">Invariant</div>
        <h2>A topological sort of a DAG is a linear ordering of its vertices such that for every directed edge u &rarr; v, vertex u comes before v in the ordering.</h2>
        <div class="formula">
          <span>u</span>
          <span class="arrow">&rarr;</span>
          <span>v</span>
        </div>
        <div class="result">
          Result Order: [ ..., u, ..., v, ... ]
        </div>
      </div>
    </div>
    <div class="footer">
      <span>Topological Sorting • CS Fundamentals</span>
      <span>04</span>
    </div>
  </div>
</body>
</html>
