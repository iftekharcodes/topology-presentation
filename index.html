<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topological Sorting — Offline Presentation</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0F172A; font-family: system-ui, sans-serif; }
        #viewer { width: 100%; height: 100%; position: relative; display: flex; align-items: center; justify-content: center; }
        iframe { width: 1280px; height: 720px; border: none; background: white; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); transform-origin: center; transition: opacity 0.4s ease, transform 0.4s ease; opacity: 0; }
        iframe.active { opacity: 1; }
        
        .controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; z-index: 100; background: rgba(15, 23, 42, 0.8); padding: 10px 20px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
        button { background: transparent; border: none; color: white; cursor: pointer; padding: 10px; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: 0.2s; opacity: 0.7; }
        button:hover { opacity: 1; transform: scale(1.1); }
        button:disabled { opacity: 0.3; cursor: not-allowed; }
        .progress { color: white; font-size: 14px; align-self: center; font-weight: 600; min-width: 60px; text-align: center; }

        /* Transitions */
        .slide-exit-next { transform: translateX(-50px); opacity: 0; }
        .slide-enter-next { transform: translateX(50px); opacity: 0; }
        .slide-exit-prev { transform: translateX(50px); opacity: 0; }
        .slide-enter-prev { transform: translateX(-50px); opacity: 0; }
    </style>
</head>
<body>
    <div id="viewer">
        <iframe id="slide-frame" src="" class="active"></iframe>
    </div>

    <div class="controls">
        <button id="prevBtn" onclick="changeSlide(-1)">&larr; Prev</button>
        <div class="progress"><span id="current">1</span> / <span id="total">12</span></div>
        <button id="nextBtn" onclick="changeSlide(1)">Next &rarr;</button>
    </div>

    <script>
        const slides = [
            'cover.html', 'why_order.html', 'graph_language.html', 'core_idea.html', 
            'kahns_algorithm.html', 'kahn_simulation.html', 'dfs_sort.html', 
            'kahn_vs_dfs.html', 'complexity.html', 'worked_example.html', 
            'pitfalls.html', 'takeaways.html'
        ];
        let currentIndex = 0;
        const frame = document.getElementById('slide-frame');
        const currentLabel = document.getElementById('current');
        const totalLabel = document.getElementById('total');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');

        function updateFrameScale() {
            const scale = Math.min(window.innerWidth / 1320, window.innerHeight / 760, 1);
            frame.style.transform = `scale(${scale})`;
        }

        function loadSlide(index, direction) {
            frame.classList.remove('active');
            
            setTimeout(() => {
                frame.src = 'slides/' + slides[index];
                currentIndex = index;
                currentLabel.textContent = index + 1;
                
                prevBtn.disabled = index === 0;
                nextBtn.disabled = index === slides.length - 1;

                frame.onload = () => {
                    frame.classList.add('active');
                };
            }, 200);
        }

        function changeSlide(delta) {
            const newIndex = currentIndex + delta;
            if (newIndex >= 0 && newIndex < slides.length) {
                loadSlide(newIndex, delta);
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') changeSlide(1);
            if (e.key === 'ArrowLeft') changeSlide(-1);
        });

        window.addEventListener('resize', updateFrameScale);
        
        totalLabel.textContent = slides.length;
        loadSlide(0);
        updateFrameScale();
    </script>
</body>
</html>
