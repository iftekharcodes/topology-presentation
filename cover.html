<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide-container { width: 1280px; min-height: 720px; background: #F8FAFC; color: #0F172A; display: flex; flex-direction: column; font-family: system-ui, -apple-system, sans-serif; position: relative; }
    .footer { position: absolute; bottom: 30px; left: 60px; right: 60px; display: flex; justify-content: space-between; font-size: 14px; color: #64748B; border-top: 1px solid #E2E8F0; padding-top: 10px; }
    .content { flex: 1; display: flex; flex-direction: column; padding: 60px 80px; }
    .badge { display: inline-block; padding: 4px 12px; background: #0EA5E9; color: white; border-radius: 4px; font-size: 14px; font-weight: 600; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 0.05em; width: fit-content; }
    h1 { font-size: 72px; line-height: 1.1; margin-bottom: 20px; color: #1E293B; }
    .subtitle { font-size: 24px; color: #475569; margin-bottom: 40px; }
    .authors { margin-top: auto; font-size: 18px; color: #64748B; line-height: 1.6; }
    .accent-bar { width: 80px; height: 8px; background: #0EA5E9; margin-bottom: 40px; }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="content">
      <div class="badge">Data Structures & Algorithms</div>
      <div class="accent-bar"></div>
      <h1>Topological Sorting</h1>
      <div class="subtitle">From DAGs to Dependency Order</div>
      <div class="authors">
        Presented by:<br>
        <strong>Iftekhar Hossain Chowdhury</strong> & <strong>Jannat Shehnaz</strong>
      </div>
    </div>
    <div class="footer">
      <span>Topological Sorting • CS Fundamentals</span>
      <span>01</span>
    </div>
  </div>
</body>
</html>
