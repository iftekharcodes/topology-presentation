<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide-container { width: 1280px; min-height: 720px; background: #F8FAFC; color: #0F172A; display: flex; flex-direction: column; font-family: system-ui, -apple-system, sans-serif; position: relative; }
    .footer { position: absolute; bottom: 30px; left: 60px; right: 60px; display: flex; justify-content: space-between; font-size: 14px; color: #64748B; border-top: 1px solid #E2E8F0; padding-top: 10px; }
    .content { flex: 1; display: flex; flex-direction: column; padding: 50px 80px 0 80px; }
    h2 { font-size: 48px; color: #1E293B; margin-bottom: 30px; }
    
    .sim-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 40px; flex: 1; margin-bottom: 60px; }
    
    .graph-pane { background: white; border-radius: 16px; border: 1px solid #E2E8F0; padding: 40px; position: relative; display: flex; align-items: center; justify-content: center; }
    .node { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #CBD5E1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: absolute; background: white; }
    .node span { font-size: 14px; font-weight: bold; }
    .node small { font-size: 10px; color: #64748B; }
    .node.active { border-color: #0EA5E9; background: #F0F9FF; box-shadow: 0 0 15px rgba(14, 165, 233, 0.2); }
    
    .state-pane { display: flex; flex-direction: column; gap: 20px; }
    .state-box { background: #F1F5F9; padding: 20px; border-radius: 12px; }
    .state-box h4 { font-size: 14px; color: #64748B; text-transform: uppercase; margin-bottom: 10px; }
    .state-box .val { font-size: 20px; font-weight: 600; color: #1E293B; }
    .current-action { background: #0EA5E9; color: white; padding: 20px; border-radius: 12px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="slide-container">
    <div class="content">
      <h2>Simulation: Kahn’s Algorithm</h2>
      <div class="sim-grid">
        <div class="graph-pane">
          <!-- A(0) -->
          <div class="node active" style="top: 50px; left: 100px;"><span>A</span><small>in:0</small></div>
          <!-- B(1) -->
          <div class="node" style="top: 50px; left: 300px;"><span>B</span><small>in:1</small></div>
          <!-- C(1) -->
          <div class="node" style="top: 200px; left: 100px;"><span>C</span><small>in:1</small></div>
          <!-- E(2) -->
          <div class="node" style="top: 125px; left: 450px;"><span>E</span><small>in:2</small></div>
          <!-- D(1) -->
          <div class="node" style="top: 250px; left: 300px;"><span>D</span><small>in:2</small></div>
        </div>
        <div class="state-pane">
          <div class="current-action">
            IDENTIFY SOURCE NODES<br>
            <span style="font-weight: 400; font-size: 14px;">Nodes with indegree 0 are ready to process.</span>
          </div>
          <div class="state-box">
            <h4>Ready Queue</h4>
            <div class="val">[ A ]</div>
          </div>
          <div class="state-box">
            <h4>Topological Order</h4>
            <div class="val">[ ]</div>
          </div>
        </div>
      </div>
    </div>
    <div class="footer">
      <span>Topological Sorting • CS Fundamentals</span>
      <span>06</span>
    </div>
  </div>
</body>
</html>
